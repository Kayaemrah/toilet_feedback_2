<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temizlik Değerlendirme - WC {{ toilet_id }}</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f6f9;
            padding:20px;
            margin:0;
        }

        .card {
            background:white;
            padding:25px;
            border-radius:14px;
            box-shadow:0 6px 18px rgba(0,0,0,0.08);
            max-width:500px;
            margin:auto;
        }

        h2 {
            text-align:center;
            margin-bottom:20px;
        }

        label {
            font-weight:600;
            display:block;
            margin-top:18px;
        }

        input, select {
            width:100%;
            padding:14px;
            margin-top:8px;
            border-radius:10px;
            border:1px solid #ddd;
            font-size:16px;
        }

        button {
            width:100%;
            padding:16px;
            margin-top:30px;
            background-color:#2c7be5;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
        }

        button:hover {
            opacity:0.9;
        }

        .footer {
            text-align:center;
            font-size:13px;
            margin-top:15px;
            color:#888;
        }

        /* ⭐ STAR RATING */
        .star-rating {
            direction: rtl;
            display: flex;
            justify-content: center;
            font-size: 2.2rem;
            margin-top: 10px;
        }

        .star-rating input {
            display: none;
        }

        .star-rating label {
            cursor: pointer;
            color: #ccc;
            transition: color 0.2s ease;
        }

        .star-rating input:checked ~ label {
            color: gold;
        }

        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: gold;
        }

        .rating-text {
            text-align:center;
            font-size:14px;
            margin-top:8px;
            color:#666;
        }

    </style>
</head>
<body>

<div class="card">

    <h2>Temizlik Değerlendirme - WC {{ toilet_id }}</h2>

    <form method="post">

        <label>İsim</label>
        <input type="text" name="first_name" required>

        <label>Soyisim</label>
        <input type="text" name="last_name" required>

        <label>İletişim (Mail veya Telefon)</label>
        <input type="text" name="contact" required>

        <label>Puan</label>
        <div class="star-rating">
            <input type="radio" id="star5" name="rating" value="5" required>
            <label for="star5">★</label>

            <input type="radio" id="star4" name="rating" value="4">
            <label for="star4">★</label>

            <input type="radio" id="star3" name="rating" value="3">
            <label for="star3">★</label>

            <input type="radio" id="star2" name="rating" value="2">
            <label for="star2">★</label>

            <input type="radio" id="star1" name="rating" value="1">
            <label for="star1">★</label>
        </div>

        <div class="rating-text">
            1 = Çok Kötü &nbsp;&nbsp; 5 = Mükemmel
        </div>

        <label>Koku var mı?</label>
        <select name="smell">
            <option value="Evet">Evet</option>
            <option value="Hayır" selected>Hayır</option>
        </select>

        <label>Sarf eksik mi? (Peçete, sabun vs.)</label>
        <select name="supplies">
            <option value="Evet">Evet</option>
            <option value="Hayır" selected>Hayır</option>
        </select>

        <label>CAPTCHA: {{ captcha_a }} + {{ captcha_b }} = ?</label>
        <input type="number" name="captcha" required>
        <input type="hidden" name="expected_captcha" value="{{ captcha_answer }}">

        <button type="submit">Gönder</button>

    </form>

    <div class="footer">
        Geri bildiriminiz bizim için değerlidir.
    </div>

</div>

</body>
</html>
