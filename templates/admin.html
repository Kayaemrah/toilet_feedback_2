<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial; margin: 40px; }
        table { border-collapse: collapse; width: 100%; margin-top: 30px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f4f4f4; }
        .card {
            background: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .filter-box {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<h2>Admin Panel</h2>

<!-- Filtre -->
<div class="filter-box">
    <form method="get">
        <input type="hidden" name="key" value="{{ request.args.get('key') }}">
        <input type="text" name="toilet" placeholder="WC No"
               value="{{ selected_toilet or '' }}">
        <button type="submit">Filtrele</button>
    </form>
</div>

<!-- Ortalama -->
<div class="card">
    <strong>Ortalama Puan:</strong> {{ average }}
</div>

<!-- Grafik -->
<h3>Puan Dağılımı</h3>
<canvas id="ratingChart" height="100"></canvas>

<!-- Tablo -->
<h3>Tüm Kayıtlar</h3>

<table>
    <tr>
        <th>ID</th>
        <th>WC</th>
        <th>Puan</th>
        <th>Koku</th>
        <th>Malzeme</th>
        <th>Ad</th>
        <th>Soyad</th>
        <th>İletişim</th>
        <th>IP</th>
        <th>Tarih</th>
    </tr>

    {% for row in rows %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
        <td>{{ row[5] }}</td>
        <td>{{ row[6] }}</td>
        <td>{{ row[7] }}</td>
        <td>{{ row[8] }}</td>
        <td>{{ row[9] }}</td>
    </tr>
    {% endfor %}
</table>

<script>
    const ratingCounts = {{ rating_counts | default([0,0,0,0,0]) | tojson }};

    new Chart(document.getElementById("ratingChart"), {
        type: "bar",
        data: {
            labels: ['1','2','3','4','5'],
            datasets: [{
                label: "Puan Sayısı",
                data: ratingCounts,
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>

</body>
</html>
